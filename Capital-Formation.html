<style>
  html, body { height: 100%; margin: 0; }
  #cf-lock {

    background: #f3f1ec; color: #1c1915;
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }
  #cf-lock .card {
    background: #fffcf8; border: 1px solid #e4dfd6; border-radius: 12px;

  #cf-lock label { display: block; font-size: 0.8rem; color: #6d675f; margin-bottom: 6px; }
  #cf-lock input[type=password] {
    width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 8px;
    border: 1px solid #cfc8bc; background: #fff; font-size: 1rem; color: #1c1915;
  }
  #cf-lock input[type=password]:focus { outline: 2px solid #1c1915; outline-offset: 1px; }
  #cf-lock button {
    margin-top: 14px; width: 100%; padding: 10px 14px; border: 0; border-radius: 8px;
    background: #1c1915; color: #fffcf8; font-size: 0.95rem; font-weight: 600; cursor: pointer;
  }
  #cf-lock button:hover { background: #33302b; }
  #cf-lock button[disabled] { opacity: .6; cursor: progress; }

<script>
(function () {
  "use strict";
  var P = JSON.parse(document.getElementById("cf-enc").textContent);
  var SKEY = "cf-team-key:" + P.salt.slice(0, 16);
  var form = document.getElementById("cf-lock-form");
  var input = document.getElementById("cf-lock-pw");
  var btn = document.getElementById("cf-lock-btn");
  var err = document.getElementById("cf-lock-err");

  function b64(s) {
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function tob64(buf) {
    var a = new Uint8Array(buf), s = "";
    for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);
    return btoa(s);
  }
  function fail(msg) {
    err.textContent = msg;
    btn.disabled = false; btn.textContent = "Unlock";
    input.disabled = false; input.select();
  }

  var supported = !!(window.crypto && crypto.subtle && window.TextDecoder &&
    (P.comp === "none" || typeof DecompressionStream === "function"));
  if (!supported) {
    err.textContent = "This browser can't decrypt the file. Open it in current Chrome, Edge, Safari or Firefox.";
  }

  function deriveKey(pw) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256" },
          base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
      });
  }

  function decryptWith(key) {
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.ct))
      .then(function (plain) {
        if (P.comp === "none") return new TextDecoder().decode(plain);
        var ds = new Blob([plain]).stream().pipeThrough(new DecompressionStream(P.comp));
        return new Response(ds).arrayBuffer().then(function (b) { return new TextDecoder().decode(b); });
      });
  }

  function render(html) {
    document.open();
    document.write(html);
    document.close();
  }

  // Reload within the same tab session: reuse the cached derived key (never the password).
  try {
    var cached = sessionStorage.getItem(SKEY);
    if (cached && supported) {
      crypto.subtle.importKey("raw", b64(cached), "AES-GCM", false, ["decrypt"])
        .then(decryptWith).then(render)
        .catch(function () { try { sessionStorage.removeItem(SKEY); } catch (e) {} });
    }
  } catch (e) {}

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!supported) return;
    err.textContent = "";
    var pw = input.value || "";
    btn.disabled = true; btn.textContent = "Unlocking…"; input.disabled = true;
    var keyRef;
    deriveKey(pw).then(function (key) {
      keyRef = key;
      return decryptWith(key);
    }).then(function (html) {
      return crypto.subtle.exportKey("raw", keyRef).then(function (raw) {
        try { sessionStorage.setItem(SKEY, tob64(raw)); } catch (e) {}
        return html;
      }, function () { return html; });
    }).then(render, function () {
      input.value = "";
      fail("Incorrect password");
    });
  });
})();
</script>
